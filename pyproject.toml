[project]
name = "filings-analyst"
version = "0.1.0"
description = "Multi-hop RAG + agent system over SEC filings with XBRL-grounded numbers and span-level citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "langchain-core>=0.3.15,<0.4",
    "langchain-community>=0.3.5,<0.4",
    "langchain-google-genai>=2.0.5,<3",
    "langchain-groq>=0.2.1,<0.3",
    "langgraph>=0.2.45,<0.3",
    "langgraph-checkpoint-sqlite>=2.0.1,<3",
    "langsmith>=0.1.147,<0.2",
    "pinecone>=5.4.0,<6",
    "tenacity>=9.0.0,<10",
    "structlog>=24.4.0,<25",
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "httpx>=0.27.2,<0.28",
    "beautifulsoup4>=4.12.3,<5",
    "lxml>=5.3.0,<6",
    "pyyaml>=6.0.2,<7",
    "tiktoken>=0.8.0,<0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7.2,<0.8",
    "mypy>=1.13.0,<2",
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "types-pyyaml>=6.0.12.20240917,<7",
    "types-beautifulsoup4>=4.12.0.20240907,<5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/fixtures"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_analyst"]
